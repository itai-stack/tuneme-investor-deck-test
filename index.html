<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TuneMe | Confidential</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Babel for TSX/JSX support in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        bg: '#050510',
                        cyan: '#00f0ff',
                        purple: '#7000ff',
                        muted: '#8899aa',
                        'accent-pink': '#ff0055',
                        'accent-gold': '#ffcc00',
                    },
                    keyframes: {
                        fadeInDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        'pulse-slow': {
                            '0%, 100%': { opacity: '0.1', transform: 'translate(-50%, -50%) scale(1)' },
                            '50%': { opacity: '0.3', transform: 'translate(-50%, -50%) scale(1.2)' },
                        },
                        'spin-slow': {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(360deg)' },
                        },
                        'flow': {
                            '0%': { strokeDashoffset: '1000' },
                            '100%': { strokeDashoffset: '0' },
                        },
                        'wave': {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        }
                    },
                    animation: {
                        fadeInDown: 'fadeInDown 0.6s ease-out forwards',
                        fadeInUp: 'fadeInUp 0.6s ease-out forwards',
                        fadeIn: 'fadeIn 1s ease-out forwards',
                        'pulse-slow': 'pulse-slow 4s ease-in-out infinite',
                        'spin-slow': 'spin-slow 20s linear infinite',
                        'wave': 'wave 10s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050510;
            color: white;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }
        .slide-content::-webkit-scrollbar {
            width: 6px;
        }
        .slide-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .slide-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        .slide-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        /* Custom Gradient Text Utilities */
        .text-gradient-cyan {
            background: linear-gradient(135deg, #fff 0%, #00f0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(15, 15, 22, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react-dom/": "https://esm.sh/react-dom@18.2.0/",
        "react/": "https://esm.sh/react@18.2.0/"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" src="./index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
